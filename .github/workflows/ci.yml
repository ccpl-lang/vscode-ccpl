name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package extension
        run: npx --yes @vscode/vsce package --out ccpl.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: ccpl-vsix
          path: ccpl.vsix
